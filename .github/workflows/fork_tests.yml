name: Fork tests

# The evolv fork's own regression tests. Pure-unit: they import parsers,
# resolvers and converters directly and never open a Snowflake connection, so
# they run on every push and pull request without credentials.
#
# Upstream's `Pytest` and `Getting Started` workflows need a live Snowflake
# account (`test/run_test_full.sh` issues `destroy` then `apply`), so they are
# workflow_dispatch only in this fork. This is the workflow that gates the
# fork patches.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e . pytest jsonschema

      - name: Run fork patch tests
        run: pytest test_oie_fork_patches.py test_oie_revision_guard.py -q
