name: Pytest

# Requires a live Snowflake account: the SNOWFLAKE_ACCOUNT and
# SNOWFLAKE_PRIVATE_KEY secrets, which this fork does not carry, and
# test/run_test_full.sh issues `destroy` then `apply` against whatever
# account it is pointed at. Manual dispatch only in the evolv fork -- see
# fork_tests.yml for the offline suite that runs on every push.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pytest:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: snowddl_test
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_ENV_PREFIX: PYTEST

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e .[dev]

      - name: Run pytest
        run: test/run_test_full.sh
